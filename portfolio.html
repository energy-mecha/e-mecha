function sqw(x0, x1, yc, a, per, sh, slope){
  slope = slope || 0;
  var lv = function(x){ var t = (((x - x0 - sh) % per) + per) % per; return t < per / 2 ? yc - a : yc + a; };
  var d = "M" + x0 + "," + lv(x0 + .01);
  for (var k = -6; k < 20; k++){ var e = x0 + sh + k * per / 2; if (e <= x0) continue; if (e + slope >= x1) break;
    d += " L" + e.toFixed(1) + "," + lv(e - .01) + " L" + (e + slope).toFixed(1) + "," + lv(e + .01); }
  return d + " L" + x1 + "," + lv(x1 - .01);
}
