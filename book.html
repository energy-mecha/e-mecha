(function(){

/* ---------------- data ---------------- */
var J = D.journals || [], C = D.conferences || [], P = D.patents || [], PR = D.projects || [];

var alumni = LB.alumni || [];

/* 0 · contents */

      '<div class="note" style="text-align:right">' + bi("기존 홈페이지는 아래 집 모양 버튼 ⌂", "The classic site is behind the ⌂ button") + '</div></div>'; }
});

/* 1 · about */
S.push({ t: ["연구실 소개", "About the lab"],
  L: function(){ return left({
    kicker: bi("1장 · 연구실 소개", "Chapter 1 · About"),
    title: bi("에너지는 어디로 흐를까?", "Where does the energy go?"),
    lead: bi("햇빛은 태양광 모듈에서 전기가 되고, 전력변환기를 거쳐 DC 그리드로, 그리고 집·열저장·배터리로 흘러갑니다. 우리는 이 길 위의 <b>변환 효율</b>과 <b>신뢰성</b>을 연구합니다.",
      "Sunlight becomes electricity in a PV module, passes through a power converter onto a DC grid, then flows into homes, heat storage and batteries. We study the <b>efficiency</b> and <b>reliability</b> of every step on that path."),
    formula: "P = V · I" + '<small>' + bi("전력 = 전압 × 전류", "power = voltage × current") + '</small>',
    body: '<ul class="pts">' +
      '<li>' + bi("국립순천대학교 전기공학과 · 스마트에너지연구소", "Dept. of Electrical Engineering · Smart Energy Research Institute, SCNU") + '</li>' +
      '<li>' + bi("지도교수 김대경 (IEEE Senior Member)", "Led by Prof. Dae-kyong Kim (IEEE Senior Member)") + '</li>' +
      '<li>' + bi("전력전자 · 전기기기 · 신재생에너지", "Power electronics · electric machines · renewables") + '</li></ul>',
    flap: flap("연구실 출신 교수와 창업자는 몇 명일까요?", "How many professors and founders has the lab produced?",
      "교수 <b>" + nProf + "명</b>, 창업 <b>" + nStart + "명</b> — ㈜에니트(2018), ㈜티엠씨솔루션즈(2022)를 연구실 출신이 세웠습니다.",
      "<b>" + nProf + " professors</b> and <b>" + nStart + " founders</b> — alumni started ENIT Co. (2018) and TMC Solutions (2022)."),
    note: bi("빛 → 전기 → 열 · 빛 · 움직임", "light → electricity → heat · light · motion") }); },
  R: function(){
    var rays = [0,45,90,135,180,225,270,315].map(function(a){ var r = a * Math.PI / 180;
      return "M" + (80 + 31 * Math.cos(r)).toFixed(1) + "," + (70 + 31 * Math.sin(r)).toFixed(1) + " L" + (80 + 41 * Math.cos(r)).toFixed(1) + "," + (70 + 41 * Math.sin(r)).toFixed(1); }).join(" ");
    var svg = '<svg viewBox="0 0 460 580">' +
      '<circle cx="80" cy="70" r="24" class="inkf" style="fill:#fff3c9"/><path class="ink" d="' + rays + '"/>' +
      '<path class="flow" d="M96,92 L114,140"/><path class="flow" d="M64,96 L74,142"/>' +
      '<polygon points="40,150 170,130 190,210 60,232" class="inkf" style="fill:#eef2f7"/>' +
      '<path class="thin" d="M73,145 L92,226 M106,140 L125,220 M138,135 L158,215 M50,191 L180,170"/>' +
      '<path class="ink" d="M70,231 L66,262 M178,212 L182,250"/>' +
      '<text x="200" y="150">' + biS("태양광", "PV") + '</text>' +
      wf("M125,222 L125,290 L190,290") +
      '<rect x="190" y="255" width="110" height="70" rx="6" class="inkf"/>' +
      '<text x="245" y="284" text-anchor="middle" class="mono">DAB</text>' +
      '<circle cx="236" cy="303" r="9" class="ink"/><circle cx="254" cy="303" r="9" class="ink"/>' +
      '<text x="312" y="248">' + biS("전력변환기", "converter") + '</text>' +
      wf("M300,290 L410,290 L410,370") +
      '<path class="ink" d="M40,370 L430,370" style="stroke-width:3.2"/><path class="ink" d="M40,377 L430,377" style="stroke-width:1"/>' +
      '<path class="flow" d="M410,373 L60,373"/>' +
      '<text x="40" y="360">DC grid</text>' +
      wf("M100,377 L100,432") + wf("M230,377 L230,430") + wf("M360,377 L360,440", "b") +
      '<polygon points="55,472 100,432 145,472" class="inkf"/><rect x="65" y="472" width="70" height="60" class="inkf"/>' +
      '<rect x="88" y="490" width="24" height="20" class="lamp" opacity=".8"/><rect x="88" y="490" width="24" height="20" class="ink"/>' +
      '<rect x="200" y="430" width="60" height="110" rx="14" class="inkf"/>' +
      '<rect x="204" y="468" width="52" height="68" rx="10" fill="url(#warm)"><animate attributeName="opacity" values=".6;1;.6" dur="3s" repeatCount="indefinite"/></rect>' +
      '<path class="ink" d="M214,528 L246,518 L214,508 L246,498 L214,488 L246,478" style="stroke:#b3121b"/>' +
      '<rect x="325" y="440" width="70" height="40" rx="5" class="inkf"/><rect x="395" y="452" width="6" height="16" class="inkf"/>' +
      '<polygon points="362,446 350,463 360,463 354,476 371,457 361,457 367,446" fill="#ff8a1f" stroke="#2a2926" stroke-width="1"/>' +
      '<text x="100" y="560" text-anchor="middle">' + biS("집", "home") + '</text>' +
      '<text x="230" y="565" text-anchor="middle">' + biS("열저장 (P2H)", "heat (P2H)") + '</text>' +
      '<text x="360" y="505" text-anchor="middle">ESS · EV</text></svg>';
    return fig(svg, "", '<b>' + bi("그림 1.", "Fig. 1.") + '</b> ' + bi("태양광에서 DC 그리드까지 — 에너지가 흐르는 길", "From sunlight to the DC grid — the path energy takes")); }
});

/* 2 · DAB */
S.push({ t: ["DAB 컨버터", "The DAB converter"],
  L: function(){ return left({
    kicker: bi("2장 · DAB 컨버터 & 고주파 변압기", "Chapter 2 · DAB & HF transformers"),
    title: bi("양방향으로 흐르는 전력", "Power that flows both ways"),
    lead: bi("DAB(Dual Active Bridge) 컨버터는 고주파 변압기 양쪽에 풀브리지를 하나씩 둡니다. 두 브리지 전압의 <b>위상차 φ</b>만으로 전력의 크기와 방향이 정해집니다.",
      "A Dual Active Bridge puts a full bridge on each side of a high-frequency transformer. The <b>phase shift φ</b> between the two bridge voltages alone sets how much power flows — and which way."),
    formula: "P = <sup>V₁V₂</sup>⁄<sub>2πfL</sub> · φ(1 − |φ|/π)" + '<small>' + bi("L : 누설 인덕턴스", "L : leakage inductance") + '</small>',
    body: '<ul class="pts">' +
      '<li>' + bi("누설 인덕턴스 가변형 고주파 변압기", "Variable-leakage-inductance HF transformers") + '</li>' +
      '<li>' + bi("SiC MOSFET 기생 커패시턴스 보상", "SiC MOSFET parasitic-capacitance compensation") + '</li>' +
      '<li>' + bi("누설 인덕턴스 온라인 추정 · 고장 예측", "Online leakage-inductance estimation & prognosis") + '</li></ul>',
    flap: flap("위상차 φ가 몇 도일 때 전력이 가장 클까요?", "At what phase shift φ is the power largest?",
      "<b>φ = 90° (π/2)</b>에서 최대입니다. φ가 음수가 되면 전력은 반대 방향으로 흐릅니다. 오른쪽 슬라이더로 확인해 보세요.",
      "It peaks at <b>φ = 90° (π/2)</b>. Make φ negative and power flows the other way. Try it with the slider on the right."),
    note: bi("φ를 음수로 → 전력이 거꾸로! →", "make φ negative → power reverses! →") }); },
  R: function(){
    var bridge = function(x){ return '<rect x="' + x + '" y="250" width="100" height="150" rx="4" class="inkf"/>' +
      [[x + 14, 264], [x + 66, 264], [x + 14, 362], [x + 66, 362]].map(function(p){
        return '<rect x="' + p[0] + '" y="' + p[1] + '" width="20" height="24" rx="2" class="ink"/><path class="ink" d="M' + (p[0] + 6) + ',' + (p[1] + 6) + ' L' + (p[0] + 6) + ',' + (p[1] + 18) + '"/>'; }).join("") +
      '<path class="thin" d="M' + (x + 24) + ',288 L' + (x + 24) + ',362 M' + (x + 76) + ',288 L' + (x + 76) + ',362"/>'; };
    var coil = function(x, dir){ var d = "M" + x + ",280"; for (var i = 0; i < 4; i++) d += " a8,8 0 0 " + dir + " 0,16"; return '<path class="ink" d="' + d + '"/>'; };
    var svg = '<svg viewBox="0 0 460 560">' +
      '<text x="20" y="62" class="mono">v₁</text><text x="20" y="132" class="mono">v₂</text>' +
      '<path class="thin" d="M50,70 L430,70 M50,140 L430,140" style="stroke-dasharray:3 4"/>' +
      '<path class="wv1" fill="none" stroke="#ff8a1f" stroke-width="2.4"/><path class="wv2" fill="none" stroke="#2f8cff" stroke-width="2.4"/>' +
      '<path class="phm ink" style="stroke-dasharray:3 3"/><path class="pha ink"/><text class="pht" y="186" text-anchor="middle" style="font-size:19px">φ</text>' +
      '<path class="ink" d="M22,312 L38,312 M26,322 L34,322"/><path class="ink" d="M30,312 L30,270 L70,270 M30,322 L30,380 L70,380"/>' +
      bridge(70) + coil(190, 1) + coil(270, 0) +
      '<path class="ink" d="M226,276 L226,348 M234,276 L234,348"/>' +
      '<path class="ink" d="M170,280 L190,280 M170,344 L190,344 M270,280 L290,280 M270,344 L290,344"/>' +
      bridge(290) +
      '<path class="ink" d="M422,312 L438,312 M426,322 L434,322"/><path class="ink" d="M430,312 L430,270 L390,270 M430,322 L430,380 L390,380"/>' +
      '<path class="flow dabf" d="M30,312 L30,270 L70,270 M170,280 L190,280 M270,280 L290,280 M390,270 L430,270 L430,312"/>' +
      '<path class="flow b dabc" d="M230,350 L230,274"/>' +
      '<text x="120" y="428" text-anchor="middle">' + biS("브리지 1", "bridge 1") + '</text>' +
      '<text x="230" y="428" text-anchor="middle">' + biS("고주파 변압기", "HF transformer") + '</text>' +
      '<text x="340" y="428" text-anchor="middle">' + biS("브리지 2", "bridge 2") + '</text>' +
      '<text x="30" y="470" text-anchor="middle" class="mono">V₁</text><text x="430" y="470" text-anchor="middle" class="mono">V₂</text>' +
      '<rect x="80" y="470" width="300" height="16" rx="8" class="ink"/><rect class="pbar" x="230" y="473" width="0" height="10" rx="5" fill="#ff8a1f"/>' +
      '<path class="ink" d="M230,466 L230,490"/>' +
      '<text x="80" y="512" class="mono" style="font-weight:600">-Pmax</text><text x="380" y="512" text-anchor="end" class="mono" style="font-weight:600">+Pmax</text></svg>';
    var ctl = '<div class="ctl"><b>φ</b><input type="range" class="phi" min="-90" max="90" value="45" aria-label="phase shift"><output class="phiv" style="width:42px;font:700 13px var(--head)">45°</output></div>' +
      '<div class="readout pout"></div>';
    return fig(svg, ctl, '<b>' + bi("그림 2.", "Fig. 2.") + '</b> ' + bi("위상차 φ로 전력의 크기와 방향을 조절하는 DAB 컨버터", "A DAB converter: phase shift φ sets the size and direction of power")); },
  init: function(L, R){
    var s = $(".phi", R); if (!s) return;
    var sq = function(x0, x1, yc, a, per, sh){
      var lv = function(x){ var t = (((x - x0 - sh) % per) + per) % per; return t < per / 2 ? yc - a : yc + a; };
      var d = "M" + x0 + "," + lv(x0 + .01);
      for (var k = -6; k < 20; k++){ var e = x0 + sh + k * per / 2; if (e <= x0) continue; if (e >= x1) break;
        d += " L" + e.toFixed(1) + "," + lv(e - .01) + " L" + e.toFixed(1) + "," + lv(e + .01); }
      return d + " L" + x1 + "," + lv(x1 - .01);
    };
    var upd = function(){
      var phi = +s.value, per = 190, sh = phi / 360 * per, x0 = 50, e1 = x0 + per, e2 = e1 + sh;
      $(".wv1", R).setAttribute("d", sq(50, 430, 70, 22, per, 0));
      $(".wv2", R).setAttribute("d", sq(50, 430, 140, 22, per, sh));
      $(".phm", R).setAttribute("d", "M" + e1 + ",40 L" + e1 + ",180 M" + e2 + ",110 L" + e2 + ",180");
      $(".pha", R).setAttribute("d", Math.abs(sh) > 2 ? "M" + e1 + ",172 L" + e2 + ",172" : "");
      var pt = $(".pht", R); pt.setAttribute("x", (e1 + e2) / 2 + (Math.abs(sh) < 14 ? 14 : 0));
      var x = phi / 180, p = 4 * x * (1 - Math.abs(x));
      $(".phiv", R).textContent = phi + "°";
      var bar = $(".pbar", R), w = Math.abs(p) * 147;
      bar.setAttribute("x", p >= 0 ? 230 : 230 - w); bar.setAttribute("width", w); bar.setAttribute("fill", p >= 0 ? "#ff8a1f" : "#2f8cff");
      var f = $(".dabf", R);
      f.classList.toggle("off", Math.abs(p) < .02); f.classList.toggle("rev", p < 0); f.classList.toggle("b", p < 0);
      f.style.animationDuration = (Math.abs(p) > .02 ? (0.45 / Math.abs(p)).toFixed(2) : 1) + "s";
      var pc = Math.round(Math.abs(p) * 100);
      $(".pout", R).innerHTML = "P / P<sub>max</sub> = <span class=\"hot\">" + (p < 0 ? "−" : "") + pc + "%</span> &nbsp; " +
        (Math.abs(p) < .02 ? bi("전력 흐름 없음", "no power flow") : p > 0 ? bi("V₁ → V₂ 방향", "V₁ → V₂") : bi("V₂ → V₁ 방향 (역방향)", "V₂ → V₁ (reverse)"));
    };
    s.addEventListener("input", upd); upd();
  }
});

/* 3 · P2H */
S.push({ t: ["P2H · 신재생에너지", "P2H & renewables"],
  L: function(){ return left({
    kicker: bi("3장 · P2H & 신재생에너지", "Chapter 3 · P2H & renewables"),
    title: bi("햇빛을 열로 바꾸다", "Turning sunlight into heat"),
    lead: bi("P2H(Power-to-Heat)는 남는 태양광 전력을 열로 바꿔 저장합니다. 지역과 계절에 따라 일사량이 달라지므로, 모듈의 <b>직·병렬 연결을 재구성</b>해 히터가 받는 전력을 키웁니다.",
      "Power-to-Heat stores surplus PV power as heat. Because irradiance changes with region and season, we <b>reconfigure the series–parallel connection</b> of modules to deliver more power to the heater."),
    formula: "V = n<sub>s</sub>·V<sub>m</sub> , &nbsp; I = n<sub>p</sub>·I<sub>m</sub>" + '<small>' + bi("직렬 수 n<sub>s</sub>, 병렬 수 n<sub>p</sub>", "n<sub>s</sub> in series, n<sub>p</sub> in parallel") + '</small>',
    body: '<ul class="pts"><li>' + bi("지역·계절별 일사량을 고려한 PV 직·병렬 재구성", "PV reconfiguration for regional and seasonal irradiance") + '</li>' +
      '<li>' + bi("P2H 테스트베드 구축과 AI 기반 성능 예측", "P2H testbed and AI-based performance prediction") + '</li></ul>',
    flap: flap("모듈 4장을 모두 직렬로 연결하면 전압과 전류는?", "Four modules all in series — what happens to V and I?",
      "전압은 모듈 하나의 <b>4배</b>, 전류는 <b>그대로</b>입니다. 2직렬×2병렬로 바꾸면 전압 2배, 전류 2배가 됩니다.",
      "Voltage is <b>4×</b> one module, current stays <b>the same</b>. Switch to 2-series × 2-parallel and you get 2× voltage, 2× current."),
    note: bi("버튼으로 결선을 바꿔 보세요 →", "switch the wiring with the buttons →") }); },
  R: function(){
    var mod = function(x, y, n){ return '<g><rect x="' + x + '" y="' + y + '" width="90" height="64" rx="3" class="inkf" style="fill:#eef2f7"/>' +
      '<path class="thin" d="M' + (x + 30) + ',' + y + ' L' + (x + 30) + ',' + (y + 64) + ' M' + (x + 60) + ',' + y + ' L' + (x + 60) + ',' + (y + 64) + ' M' + x + ',' + (y + 32) + ' L' + (x + 90) + ',' + (y + 32) + '"/>' +
      '<text x="' + (x + 45) + '" y="' + (y + 82) + '" text-anchor="middle" style="font-size:13px">M' + n + '</text></g>'; };
    var svg = '<svg viewBox="0 0 460 560">' +
      '<circle cx="390" cy="60" r="22" class="inkf" style="fill:#fff3c9"/>' +
      '<path class="flow" d="M370,78 L250,112"/><path class="flow" d="M376,86 L250,214"/><path class="flow" d="M366,70 L120,110"/>' +
      mod(40, 110, 1) + mod(170, 110, 2) + mod(40, 220, 3) + mod(170, 220, 4) +
