<!doctype html>
<html lang="en" data-lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="assets/js/lang.js"></script>
<title>Energy Mechatronics Lab. — The Lab Book</title>
<meta name="description" content="An interactive lab book of the Energy Mechatronics Lab., Sunchon National University — DAB converters, P2H, PV disconnection localization, DC arc detection.">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600;700&family=Gaegu:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --crimson:#b3121b; --cloth:#a3111a; --gold:#e0bd72;
  --paper:#fbf8f1; --ink:#2a2926; --ink-2:#605c55; --rule:#ddd5c4;
  --orange:#ff8a1f; --blue:#2f8cff; --mat:#8ea79f;
  --serif:"Noto Serif KR", Georgia, serif;
  --sans:"Noto Sans KR", system-ui, -apple-system, "Segoe UI", sans-serif;
  --head:"Archivo", "Noto Sans KR", sans-serif;
  --hand:"Gaegu", "Comic Sans MS", cursive;
}
html[data-lang=ko] [lang=en], html[data-lang=en] [lang=ko]{display:none !important}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{overflow:hidden;color:var(--ink);font-family:var(--sans);
  background:
    repeating-linear-gradient(0deg, rgba(120,88,44,.045) 0 2px, transparent 2px 19px),
    repeating-linear-gradient(0deg, rgba(120,88,44,.03) 0 1px, transparent 1px 7px),
    radial-gradient(ellipse at 50% 35%, #f6efe1, #e3d5bb 75%);}
/* window light */
.light{position:fixed;inset:0;pointer-events:none;z-index:20;mix-blend-mode:multiply;
  background:
    linear-gradient(112deg, transparent 0 8%, rgba(40,40,60,.07) 8% 15%, transparent 15% 19%, rgba(40,40,60,.06) 19% 22%, transparent 22%),
    linear-gradient(112deg, transparent 0 70%, rgba(40,40,60,.05) 70% 78%, transparent 78%),
    radial-gradient(ellipse at 50% 120%, rgba(0,0,0,.12), transparent 60%);}
.stage{position:fixed;left:0;right:0;top:0;bottom:64px}
.scaler{position:absolute;left:50%;top:50%;width:1100px;height:740px;perspective:2400px;transform-origin:50% 50%}
.plane{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(17deg)}
.mat{position:absolute;left:-100px;right:-100px;top:-70px;bottom:-90px;border-radius:18px;transform:translateZ(-6px);
  background:radial-gradient(ellipse at 40% 30%, rgba(255,255,255,.12), transparent 60%),
    repeating-linear-gradient(45deg, rgba(0,0,0,.018) 0 2px, transparent 2px 4px), var(--mat);
  box-shadow:0 2px 0 rgba(0,0,0,.06), 0 18px 40px -20px rgba(0,0,0,.25)}
.book{position:absolute;inset:0;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.6,.05,.3,1)}
.book.closed{transform:translateX(-275px)}
.board{position:absolute;top:-12px;bottom:-12px;left:-12px;right:-12px;border-radius:6px;transform:translateZ(-3px);
  transition:left 1.1s cubic-bezier(.6,.05,.3,1);
  background:repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px), var(--cloth);
  box-shadow:0 34px 44px -14px rgba(30,20,10,.5), 0 6px 12px rgba(0,0,0,.25)}
.book.closed .board{left:538px}
.ribbon{position:absolute;left:566px;bottom:-74px;width:14px;height:96px;background:#1f2d5a;transform:translateZ(-2px);
  clip-path:polygon(0 0,100% 0,100% 100%,50% 86%,0 100%)}
.half{position:absolute;top:0;width:550px;height:740px;background:var(--paper)}
.half.L{left:0;border-radius:3px 0 0 3px;
  background:linear-gradient(to left, rgba(60,40,10,.16), rgba(60,40,10,.04) 30px, transparent 70px), var(--paper);
  box-shadow:-1px 1px 0 #ebe4d4,-2px 2px 0 #e0d8c6,-3px 3px 0 #d5ccb8,-4px 4px 0 #cac0aa}
.half.R{left:550px;border-radius:0 3px 3px 0;
  background:linear-gradient(to right, rgba(60,40,10,.16), rgba(60,40,10,.04) 30px, transparent 70px), var(--paper);
  box-shadow:1px 1px 0 #ebe4d4,2px 2px 0 #e0d8c6,3px 3px 0 #d5ccb8,4px 4px 0 #cac0aa}
.book.closed .half.L{visibility:hidden}

/* cover */
.cover{position:absolute;left:550px;top:-12px;width:562px;height:764px;transform-style:preserve-3d;transform-origin:0 50%;
  transform:translateZ(4px) rotateY(0deg);transition:transform 1.1s cubic-bezier(.6,.05,.3,1);cursor:pointer}
.cover.open{transform:translateZ(4px) rotateY(-179.6deg)}
.cover.gone{display:none}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.face.back{transform:rotateY(180deg)}
.cover .front{border-radius:3px 8px 8px 3px;overflow:hidden;
  background:radial-gradient(ellipse at 30% 20%, rgba(255,255,255,.10), transparent 55%),
    repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(0,0,0,.05) 0 1px, transparent 1px 3px), var(--cloth);
  box-shadow:inset 14px 0 16px -6px rgba(0,0,0,.4), inset 0 0 0 1px rgba(0,0,0,.2)}
.cover .frame{position:absolute;inset:28px 28px 28px 40px;border:2px dotted var(--gold);border-radius:3px}
.cover .frame::after{content:"";position:absolute;inset:8px;border:1px solid rgba(224,189,114,.75)}
.cover .ct{position:absolute;left:40px;right:28px;top:84px;text-align:center;color:var(--gold);
  font:800 50px/1.02 var(--head);letter-spacing:-.005em;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.cover .cs{display:block;font:700 18px/1.4 var(--serif);margin-top:14px;letter-spacing:.04em}
.cover .plate{position:absolute;left:calc(50% + 6px);top:318px;width:270px;height:214px;transform:translateX(-50%);
  background:var(--paper);box-shadow:inset 0 0 0 1px rgba(0,0,0,.18), 0 1px 2px rgba(0,0,0,.4);padding:10px}
.cover .cb{position:absolute;left:40px;right:28px;bottom:70px;text-align:center;color:var(--gold);font:600 12px/1.7 var(--head);letter-spacing:.16em;text-transform:uppercase}
.cover .back{background:var(--cloth);border-radius:8px 3px 3px 8px;padding:12px 0 12px 12px}
.pwrap{position:relative;width:550px;height:740px;
  background:linear-gradient(to left, rgba(60,40,10,.16), rgba(60,40,10,.04) 30px, transparent 70px), var(--paper)}

/* leaf (turning page) */
.leaf{position:absolute;top:0;width:550px;height:740px;transform-style:preserve-3d;pointer-events:none;
  transition:transform .9s cubic-bezier(.45,.05,.3,1)}
.leaf.fwd{left:550px;transform-origin:0 50%;transform:translateZ(2px) rotateY(0deg)}
.leaf.fwd.go{transform:translateZ(2px) rotateY(-180deg)}
.leaf.bwd{left:0;transform-origin:100% 50%;transform:translateZ(2px) rotateY(0deg)}
.leaf.bwd.go{transform:translateZ(2px) rotateY(180deg)}
.leaf .face{background:var(--paper)}
.leaf .face.r{background:linear-gradient(to right, rgba(60,40,10,.16), rgba(60,40,10,.04) 30px, transparent 70px), var(--paper)}
.leaf .face.l{background:linear-gradient(to left, rgba(60,40,10,.16), rgba(60,40,10,.04) 30px, transparent 70px), var(--paper)}

/* page content */
.page{position:absolute;inset:0;padding:48px 56px 46px 52px;font:14px/1.65 var(--sans);overflow:hidden}
.R .page,.face.r .page{padding:48px 52px 46px 58px}
.pg{display:flex;flex-direction:column;height:100%}
.kicker{font:700 11px var(--head);letter-spacing:.16em;text-transform:uppercase;color:var(--crimson)}
.ttl{font:700 30px/1.25 var(--serif);margin:8px 0 12px;letter-spacing:-.01em}
.lead{margin:0 0 8px;font-size:14.5px}
.page p{margin:0 0 8px}
.formula{font:italic 600 19px/1.4 var(--serif);text-align:center;margin:10px 0 12px;padding:10px 4px;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
.formula small{display:block;font:400 11.5px var(--sans);font-style:normal;color:var(--ink-2);margin-top:2px}
.pts{margin:2px 0 6px;padding:0;list-style:none}
.pts li{position:relative;padding-left:18px;margin:3px 0;font-size:13.5px}
.pts li::before{content:"";position:absolute;left:2px;top:.62em;width:7px;height:7px;border:1.5px solid var(--crimson);border-radius:50%}
.flap{position:relative;margin-top:12px;perspective:700px;cursor:pointer;user-select:none}
.flap .a{background:#fff;border:1px dashed #9c958a;border-radius:4px;padding:10px 14px 10px;font-size:13px;line-height:1.55;min-height:82px}
.flap .a b{color:var(--crimson)}
.flap .q{position:absolute;inset:0;background:linear-gradient(#f3e8c9,#eadbb2);border:1px solid #d6c493;border-radius:4px;padding:9px 14px;
  transform-origin:50% 0;transition:transform .7s cubic-bezier(.4,.1,.3,1);backface-visibility:hidden;box-shadow:0 2px 5px rgba(0,0,0,.14)}
.flap.open .q{transform:rotateX(178deg)}
.flap .tag{font:700 10px var(--head);letter-spacing:.16em;color:var(--crimson)}
.flap .qq{font:700 19px/1.2 var(--hand);margin:2px 0}
.flap .hint{font:15px var(--hand);color:var(--ink-2);float:right;margin-top:-2px}
.note{margin-top:auto;font:18px/1.2 var(--hand);color:#46617a;transform:rotate(-2deg);padding-top:10px}
.folio{position:absolute;bottom:20px;left:0;right:0;text-align:center;font:600 11px var(--head);color:#a39c8f;letter-spacing:.1em}

.fig-pg{display:flex;flex-direction:column;height:100%}
.fig-pg svg{width:100%;flex:1;min-height:0}
.figcap{font:italic 12.5px/1.5 var(--serif);color:var(--ink-2);text-align:center;margin-top:6px}
.figcap b{font-style:normal;color:var(--ink)}
.ctl{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap;margin-top:6px;font-size:13px}
.ctl input[type=range]{accent-color:var(--crimson);width:190px}
.tg{border:1.4px solid var(--ink);background:var(--paper);color:var(--ink);border-radius:999px;padding:4px 13px;font:600 12.5px var(--sans);cursor:pointer}
.tg.on{background:var(--ink);color:var(--paper)}
.readout{font:700 13px var(--head);text-align:center;margin-top:4px;min-height:20px}
.readout .hot{color:var(--crimson)}

/* svg ink */
svg text{font-family:var(--hand);font-size:16px;fill:var(--ink)}
svg .mono{font-family:var(--head);font-size:12px;font-weight:700}
.ink{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.inkf{fill:var(--paper);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.thin{fill:none;stroke:var(--ink);stroke-width:.9;opacity:.75}
.flow{fill:none;stroke:var(--orange);stroke-width:3.4;stroke-linecap:round;stroke-dasharray:2 13;animation:flow 1s linear infinite;filter:url(#glow)}
.flow.b{stroke:var(--blue)}
.flow.rev{animation-direction:reverse}
.flow.off{opacity:0;transition:opacity .3s}
@keyframes flow{to{stroke-dashoffset:-15}}
.pm{cursor:pointer}
.pm:hover rect{fill:#fff4e6}
.lamp{fill:#ffd66b;filter:url(#glow)}
@media (prefers-reduced-motion: reduce){.flow{animation:none;stroke-dasharray:none;opacity:.6}}

/* stats, people, news */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 14px;margin:8px 0 4px}
.stat{border-top:2px solid var(--ink);padding-top:6px}
.stat b{display:block;font:800 34px/1.05 var(--head);letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--ink-2);line-height:1.35;display:block}
.stat.hot b{color:var(--crimson)}
.pi{display:flex;gap:18px;margin:6px 0 10px}
.photo{position:relative;flex:none;background:#fff;padding:6px 6px 22px;box-shadow:0 2px 6px rgba(0,0,0,.2);transform:rotate(-2deg)}
.photo img{display:block;width:118px;height:150px;object-fit:cover}
.photo::before,.pol::before{content:"";position:absolute;top:-8px;left:50%;width:58px;height:16px;transform:translateX(-50%) rotate(-3deg);background:rgba(240,228,190,.75);box-shadow:0 1px 1px rgba(0,0,0,.08)}
.career{list-style:none;margin:0;padding:0;font-size:12.5px;line-height:1.5}
.career li{margin:0 0 5px}
.career i{font-style:normal;font:700 11px var(--head);color:var(--crimson);display:block}
.pols{display:grid;grid-template-columns:repeat(4,1fr);gap:20px 14px;margin-top:10px}
.pol{position:relative;background:#fff;padding:5px 5px 3px;box-shadow:0 2px 5px rgba(0,0,0,.18);transform:rotate(var(--r))}
.pol::before{width:36px;height:12px;top:-6px}
.pol img,.pol .ini{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;background:#ece6da}
.pol .ini{display:grid;place-items:center;font:700 26px var(--serif);color:#b0a796}
.pol .nm{font:16px/1.3 var(--hand);text-align:center;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.news{list-style:none;margin:6px 0 0;padding:0}
.news li{display:grid;grid-template-columns:58px 1fr;gap:8px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:12.8px;line-height:1.5}
.news .d{font:700 11.5px var(--head);color:var(--crimson);padding-top:2px}
.news .t{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.news a{color:inherit;text-decoration:none}
.news a:hover{color:var(--crimson)}
.links{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.links a{display:block;border:1.4px solid var(--ink);border-radius:6px;padding:8px 12px;text-decoration:none;color:var(--ink);font:600 13px var(--sans);background:#fff}
.links a:hover{background:var(--ink);color:var(--paper)}
.links a small{display:block;font:400 11.5px var(--sans);color:var(--ink-2)}
.links a:hover small{color:#d8d3c8}
.toc{list-style:none;padding:0;margin:14px 0 0;counter-reset:c}
.toc li{display:flex;align-items:baseline;gap:10px;padding:9px 0;border-bottom:1px dotted #bdb4a4;cursor:pointer;font:600 15px var(--serif)}
.toc li:hover{color:var(--crimson)}
.toc .n{font:700 12px var(--head);color:var(--crimson);width:22px}
.toc .p{margin-left:auto;font:600 12px var(--head);color:var(--ink-2)}
.emblem{width:84px;height:84px;object-fit:contain;margin:6px 0 10px}

/* toolbar */
.bar{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:30;display:flex;align-items:center;gap:4px;
  background:rgba(250,248,243,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(0,0,0,.08);
  border-radius:999px;padding:6px 8px;box-shadow:0 8px 24px rgba(0,0,0,.18);font:600 14px var(--sans);max-width:calc(100vw - 24px)}
.bar button,.bar a{border:0;background:none;color:var(--ink);height:34px;min-width:34px;border-radius:999px;cursor:pointer;font:inherit;display:grid;place-items:center;text-decoration:none;padding:0 8px}
.bar button:hover,.bar a:hover{background:rgba(0,0,0,.07)}
.bar button:disabled{opacity:.3;cursor:default;background:none}
.bar .lbl{min-width:200px;display:flex;gap:10px;align-items:center;padding:0 10px;white-space:nowrap;overflow:hidden}
.bar .lbl i{font:700 12px var(--head);font-style:normal;color:var(--crimson)}
.bar .sep{width:1px;height:20px;background:rgba(0,0,0,.12);margin:0 4px}
.bar .lang{font:700 12px var(--head);letter-spacing:.06em}
.bar svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tocpop{position:fixed;left:50%;bottom:66px;transform:translateX(-50%);z-index:31;background:rgba(250,248,243,.97);border-radius:12px;
  box-shadow:0 10px 30px rgba(0,0,0,.22);padding:8px;min-width:280px;display:none}
.tocpop.show{display:block}
.tocpop button{display:flex;width:100%;gap:12px;border:0;background:none;padding:9px 12px;border-radius:8px;font:600 14px var(--sans);cursor:pointer;text-align:left;color:var(--ink)}
.tocpop button:hover,.tocpop button.cur{background:rgba(179,18,27,.08)}
.tocpop i{font:700 12px var(--head);font-style:normal;color:var(--crimson);width:18px}
.openhint{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);z-index:25;font:22px var(--hand);color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.4);transition:opacity .4s;pointer-events:none}
.opened .openhint{opacity:0}

/* flat (phones) */
body.flat{overflow:auto;padding-bottom:80px}
body.flat .light{display:none}
body.flat .stage{position:static}
body.flat .scaler{position:static;width:auto;height:auto;transform:none !important;perspective:none;padding:14px}
body.flat .plane,body.flat .book{position:static;transform:none !important}
body.flat .mat,body.flat .board,body.flat .ribbon,body.flat .cover .back{display:none}
body.flat .half{position:relative;left:auto;width:auto;height:auto;border-radius:4px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
body.flat .page{position:static;padding:28px 22px 40px !important}
body.flat .book.closed .half{display:none}
body.flat .cover{position:relative;left:auto;top:auto;width:100%;height:auto;aspect-ratio:562/764;max-width:460px;margin:10px auto;transform:none !important}
body.flat .cover.gone{display:none}
body.flat .fig-pg svg{flex:none;height:auto}
body.flat .ttl{font-size:25px}
body.flat .pols{grid-template-columns:repeat(3,1fr)}
body.flat .bar .lbl{min-width:0;max-width:44vw}
body.flat .openhint{color:var(--ink);text-shadow:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigglow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="5" stroke="#2a2926" stroke-width=".8" opacity=".55"/>
    </pattern>
    <linearGradient id="warm" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ff8a1f" stop-opacity=".55"/><stop offset="1" stop-color="#ffd27a" stop-opacity=".15"/>
    </linearGradient>
  </defs>
</svg>

<div class="stage" id="stage">
  <div class="scaler" id="scaler">
    <div class="plane">
      <div class="mat"></div>
      <div class="book closed" id="book">
        <div class="board"></div>
        <div class="ribbon"></div>
        <div class="half L"><article class="page" id="pL"></article></div>
        <div class="half R"><article class="page" id="pR"></article></div>
        <div class="cover" id="cover" role="button" tabindex="0" aria-label="Open the book">
          <div class="face front">
            <div class="frame"></div>
            <div class="ct">Energy<br>Mechatronics<span class="cs">에너지메카트로닉스연구실</span></div>
            <div class="plate">
              <svg viewBox="0 0 250 194" style="width:100%;height:100%">
                <circle cx="40" cy="36" r="15" class="inkf" style="fill:#fff3c9"/>
                <path class="ink" d="M40,12 L40,6 M40,60 L40,66 M16,36 L10,36 M64,36 L70,36 M23,19 L19,15 M57,53 L61,57 M57,19 L61,15 M23,53 L19,57"/>
                <polygon points="22,92 92,80 104,124 34,137" class="inkf"/>
                <path class="thin" d="M45,88 L57,132 M68,84 L80,128 M28,114 L98,102"/>
                <path class="flow" d="M52,52 L64,84"/>
                <path class="ink" d="M70,130 L70,160 L120,160"/><path class="flow" d="M70,130 L70,160 L120,160"/>
                <rect x="120" y="140" width="54" height="40" rx="4" class="inkf"/>
                <text x="147" y="166" text-anchor="middle" class="mono">DAB</text>
                <path class="ink" d="M174,160 L212,160 L212,120"/><path class="flow b" d="M174,160 L212,160 L212,120"/>
                <path class="inkf" d="M200,120 C200,96 224,96 224,120 C224,128 218,130 218,136 L206,136 C206,130 200,128 200,120 Z"/>
                <circle cx="212" cy="112" r="16" class="lamp" opacity=".55"/>
              </svg>
            </div>
            <div class="cb">A Lab Book · 2026<br>Sunchon National University · Electrical Engineering</div>
          </div>
          <div class="face back"><div class="pwrap"><article class="page" id="coverBack"></article></div></div>
        </div>
      </div>
    </div>
  </div>
</div>
<div class="light"></div>
<div class="openhint" id="openhint"><span lang="ko">책을 눌러 펼쳐 보세요</span><span lang="en">Tap the book to open it</span></div>

<div class="tocpop" id="tocpop"></div>
<nav class="bar" aria-label="Book navigation">
  <button id="bToc" title="Contents"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg></button>
  <button id="bPrev" title="Previous"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="lbl" id="lbl"></div>
  <button id="bNext" title="Next"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>

      '<rect x="160" y="56" width="14" height="14" fill="#fbe3c8" stroke="#2a2926"/><text x="180" y="68" style="font-size:14px">' + biS("학술대회", "conferences") + '</text></svg>';
    return fig(s, "", '<b>' + bi("그림 6.", "Fig. 6.") + '</b> ' + bi("연도별 저널·학술대회 논문 수 (" + first + "–" + last + ")", "Journal and conference papers per year (" + first + "–" + last + ")")); },
  init: function(L){
    var els = $$("[data-n]", L), t0 = performance.now(), raf = 0;
    var step = function(t){ var u = Math.min(1, (t - t0) / 1100), e = 1 - Math.pow(1 - u, 3);
      els.forEach(function(el){ el.textContent = Math.round(+el.dataset.n * e); });
      if (u < 1) raf = requestAnimationFrame(step); };
    raf = requestAnimationFrame(step);
    onCleanup(function(){ cancelAnimationFrame(raf); els.forEach(function(el){ el.textContent = el.dataset.n; }); });
  }
});

/* 7 · people */
S.push({ t: ["구성원", "The people"],
  L: function(){
    var pi = LB.pi || {};
    var car = (pi.career || []).concat(pi.service || []).slice(0, 5).map(function(c){ return '<li><i>' + bo(c.when) + '</i>' + bo(c.what) + '</li>'; }).join("");

      kicker: bi("7장 · 구성원", "Chapter 7 · People"),
      title: bi("함께하는 사람들", "The people behind the work"),
      body: '<div class="pi"><div class="photo"><img src="' + (pi.photo || "assets/img/prof-kim.jpg") + '" alt=""></div>' +
        '<div><div style="font:700 19px var(--serif)">' + bi((pi.name || "") + " 교수", pi.nameEn || "") + '</div>' +
        '<div style="font-size:12px;color:var(--ink-2);margin:2px 0 8px">' + bo(pi.title) + '</div><ul class="career">' + car + '</ul></div></div>',
      flap: flap("연구실 졸업생은 지금 어디에 있을까요?", "Where are the lab's alumni now?",
        "졸업생 <b>" + alumni.length + "명</b> 가운데 교수 " + nProf + "명, 창업 " + nStart + "명이 있으며, 많은 졸업생이 지역 에너지 기업과 연구기관에서 일하고 있습니다.",
        "Of our <b>" + alumni.length + " alumni</b>, " + nProf + " became professors and " + nStart + " founded companies; many others work at regional energy companies and institutes."),
      note: '<a href="members.html" style="color:inherit">' + bi("구성원 전체 보기 →", "meet everyone →") + '</a>' }); },
  R: function(){
    var rot = [-2.5, 1.8, -1, 2.4, 1.2, -2, 2.2, -1.4, -2.2, 1.5, -1.2, 2];
    var shown = members.slice(0, 12);
    var cards = shown.map(function(m, i){
      var nm = m.name || {}, ini = (nm.ko || nm.en || "?").charAt(0);
      return '<div class="pol" style="--r:' + rot[i % rot.length] + 'deg">' + (m.photo ? '<img src="' + m.photo + '" alt="" loading="lazy">' : '<div class="ini">' + ini + '</div>') +
        '<div class="nm">' + bo(m.name) + '</div></div>'; }).join("");
    var more = members.length - shown.length;
    return '<div class="pg"><div class="kicker">' + bi("현재 구성원", "Current members") + '</div>' +
      '<h2 class="ttl" style="font-size:24px">' + bi("대학원생 · 학부연구생 " + members.length + "명", members.length + " graduate & undergraduate researchers") + '</h2>' +
      '<div class="pols">' + cards + '</div>' + (more > 0 ? '<div class="note" style="text-align:right">+' + more + '</div>' : "") + '</div>'; }
});

/* 8 · news & join */
S.push({ t: ["소식 · 함께하기", "News & join us"],
  L: function(){
    var tl = { publication: ["논문", "Paper"], patent: ["특허", "Patent"], award: ["수상", "Award"], project: ["과제", "Grant"], people: ["구성원", "People"], teaching: ["교육", "Teaching"] };
    var li = (LB.news || []).slice(0, 7).map(function(n){ var t = tl[n.type] || ["", ""];
      var txt = bo(n.text); if (n.link) txt = '<a href="' + n.link + '">' + txt + '</a>';
      return '<li><span class="d">' + n.date + '<br><span style="color:var(--ink-2);font-weight:600">' + bi(t[0], t[1]) + '</span></span><span class="t">' + txt + '</span></li>'; }).join("");
    return '<div class="pg"><div class="kicker">' + bi("8장 · 최근 소식", "Chapter 8 · Latest news") + '</div>' +
      '<h2 class="ttl">' + bi("연구실의 요즘", "What's new") + '</h2><ul class="news">' + li + '</ul>' +
      '<div class="note"><a href="index.html#news" style="color:inherit">' + bi("모든 소식 보기 →", "all news →") + '</a></div></div>'; },
  R: function(){
    var c = LB.contact || {};
    var lk = [["research.html", "연구 분야", "Research", "4대 연구 주제", "four research themes"], ["publications.html", "논문 · 특허", "Publications", "저널 · 학회 · 특허", "journals, conferences, patents"],
      ["members.html", "구성원", "Members", "교수 · 학생 · 졸업생", "professor, students, alumni"], ["projects.html", "연구과제", "Projects", "수행 과제", "funded projects"],
      ["teaching.html", "교육", "Teaching", "강의 · 비교과과정", "courses & workshops"], ["awards.html", "수상", "Awards", "수상 실적", "honours"]]
      .map(function(a){ return '<a href="' + a[0] + '">' + bi(a[1], a[2]) + '<small>' + bi(a[3], a[4]) + '</small></a>'; }).join("");
    return '<div class="pg"><div class="kicker">' + bi("함께하기", "Join us") + '</div>' +
      '<h2 class="ttl">' + bi("다음 장은 당신이 씁니다", "The next chapter is yours") + '</h2>' +
      '<p>' + bi("전력전자 · 전기기기 · 신재생에너지에 관심 있는 대학원생(석사·박사)과 학부연구생을 기다립니다. 간단한 자기소개와 관심 분야를 적어 연락 주세요. 연구실 방문도 환영합니다.",
        "We welcome graduate (M.S./Ph.D.) and undergraduate researchers interested in power electronics, electric machines and renewable energy. Send a short introduction and your interests — lab visits are always welcome.") + '</p>' +
      (c.email ? '<p style="font:700 15px var(--head)">✉ <a href="mailto:' + c.email + '" style="color:var(--crimson)">' + c.email + '</a>' + (c.phone ? ' &nbsp;·&nbsp; ☎ ' + c.phone : "") + '</p>' : "") +
      '<div class="links">' + lk + '</div>' +
      '<div class="note" style="text-align:right">' + bi("— 끝, 그리고 시작", "— the end, and a beginning") + '</div></div>'; }
});

/* ---------------- book engine ---------------- */
var book = $("#book"), cover = $("#cover"), pL = $("#pL"), pR = $("#pR"), scaler = $("#scaler");
var cur = -1, busy = false, flat = false;
function folio(n){ return '<div class="folio">' + n + '</div>'; }
function html(i){ return { L: S[i].L() + folio(i * 2 + 1 - 1 || "i"), R: S[i].R() + folio(i * 2 + 1) }; }
function place(i){ var h = html(i); pL.innerHTML = h.L; pR.innerHTML = h.R; }
function initSpread(i){ if (S[i] && S[i].init) S[i].init(pL, pR); }
function after(el, ms, fn){ var done = false; var f = function(){ if (done) return; done = true; el.removeEventListener("transitionend", h); fn(); };
  var h = function(e){ if (e.target === el && e.propertyName === "transform") f(); }; el.addEventListener("transitionend", h); setTimeout(f, ms); }
function mkLeaf(dir, frontHTML, backHTML){
  var lf = document.createElement("div"); lf.className = "leaf " + dir;
  lf.innerHTML = '<div class="face front ' + (dir === "fwd" ? "r" : "l") + '"><article class="page">' + frontHTML + '</article></div>' +
    '<div class="face back ' + (dir === "fwd" ? "l" : "r") + '"><article class="page">' + backHTML + '</article></div>';
  book.appendChild(lf); return lf;
}
function go(t){
  t = Math.max(-1, Math.min(S.length - 1, t));
  if (busy || t === cur) return;
  $("#tocpop").classList.remove("show");
  runCleanup();
  var from = cur; cur = t; ui();
  if (flat){
    if (t < 0){ book.classList.add("closed"); cover.classList.remove("gone", "open"); }
    else { book.classList.remove("closed"); cover.classList.add("gone"); place(t); initSpread(t); window.scrollTo(0, 0); }
    return;
  }
  busy = true;
  if (from < 0){                                       /* open the book */
    var h = html(t); pR.innerHTML = h.R; $("#coverBack").innerHTML = h.L;
    cover.classList.remove("gone"); void cover.offsetWidth;
    book.classList.remove("closed"); cover.classList.add("open");
    after(cover, 1400, function(){ pL.innerHTML = h.L; cover.classList.add("gone"); busy = false; initSpread(t); });
    return;
  }
  if (t < 0){                                          /* close the book */
    $("#coverBack").innerHTML = pL.innerHTML;
    cover.classList.remove("gone"); void cover.offsetWidth;
    book.classList.add("closed"); cover.classList.remove("open");
    after(cover, 1400, function(){ busy = false; });
    return;
  }
  var n = html(t), lf;
  if (t > from){
    lf = mkLeaf("fwd", pR.innerHTML, n.L); pR.innerHTML = n.R;
    void lf.offsetWidth; lf.classList.add("go");
    after(lf, 1200, function(){ pL.innerHTML = n.L; lf.remove(); busy = false; initSpread(t); });
  } else {
    lf = mkLeaf("bwd", pL.innerHTML, n.R); pL.innerHTML = n.L;
    void lf.offsetWidth; lf.classList.add("go");
    after(lf, 1200, function(){ pR.innerHTML = n.R; lf.remove(); busy = false; initSpread(t); });
  }
}
function ui(){
  var title = cur < 0 ? ["표지", "Cover"] : S[cur].t;
  $("#lbl").innerHTML = '<i>' + (cur < 0 ? "—" : String(cur).padStart(2, "0")) + '</i>' + bi(title[0], title[1]);
  $("#bPrev").disabled = cur < 0; $("#bNext").disabled = cur >= S.length - 1;
  document.body.classList.toggle("opened", cur >= 0);
  $("#tocpop").innerHTML = '<button data-go="-1"' + (cur < 0 ? ' class="cur"' : "") + '><i>—</i>' + bi("표지", "Cover") + '</button>' +
    S.map(function(s, i){ return '<button data-go="' + i + '"' + (i === cur ? ' class="cur"' : "") + '><i>' + String(i).padStart(2, "0") + '</i>' + bi(s.t[0], s.t[1]) + '</button>'; }).join("");
  try { history.replaceState(null, "", cur < 0 ? location.pathname + location.search : "#p" + cur); } catch (e) {}
}
function fit(){
  var f = innerWidth < 760 || innerHeight < 500;
  if (f !== flat){ flat = f; document.body.classList.toggle("flat", flat);
    if (cur >= 0){ book.classList.remove("closed"); cover.classList.add("open", "gone"); } }
  if (flat){ scaler.style.transform = ""; return; }
  var s = Math.min((innerWidth - 40) / 1300, (innerHeight - 90) / 900);
  scaler.style.transform = "translate(-50%,-50%) scale(" + s.toFixed(3) + ")";
}

/* events */
cover.addEventListener("click", function(){ if (cur < 0) go(0); });
cover.addEventListener("keydown", function(e){ if ((e.key === "Enter" || e.key === " ") && cur < 0){ e.preventDefault(); go(0); } });
$("#bPrev").addEventListener("click", function(){ go(cur - 1); });
$("#bNext").addEventListener("click", function(){ go(cur + 1); });
$("#bToc").addEventListener("click", function(e){ e.stopPropagation(); $("#tocpop").classList.toggle("show"); });
$("#bLang").addEventListener("click", function(){
  var l = lang() === "ko" ? "en" : "ko";
  document.documentElement.setAttribute("data-lang", l); document.documentElement.lang = l;
  try { localStorage.setItem("lang", l); } catch (e) {}
});
document.addEventListener("click", function(e){
  var g = e.target.closest("[data-go]"); if (g && !g.closest(".leaf")){ go(+g.dataset.go); return; }
  var f = e.target.closest(".flap"); if (f && !f.closest(".leaf,.cover")){ f.classList.toggle("open"); return; }
  if (!e.target.closest("#tocpop")) $("#tocpop").classList.remove("show");
});
document.addEventListener("keydown", function(e){
  if (e.target.tagName === "INPUT") return;
  if (e.key === "ArrowRight") go(cur + 1); else if (e.key === "ArrowLeft") go(cur - 1);
});
addEventListener("resize", fit);

var m = /^#p(\d+)$/.exec(location.hash);
fit();
if (m){ var t0 = Math.min(S.length - 1, +m[1]); cur = t0; book.classList.remove("closed"); cover.classList.add("open", "gone"); place(t0); initSpread(t0); }
ui();
addEventListener("hashchange", function(){ var h = /^#p(\d+)$/.exec(location.hash); if (h && +h[1] !== cur) go(+h[1]); });
})();
</script>
